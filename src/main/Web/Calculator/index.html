<!DOCTYPE html>
<html>
<head>
    <title>Simple Interest Calculator</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class = "maindiv"><h1>Simple Interest Calculator</h1>

    Amount <input type="number"  id="principal">  <br/>
    Rate <input type="range"  id="rate" min="1" max="20" value="10.25" step="0.25" onchange="updateRate()">  <br/>
    <span id="rate_val"> </span>%<br/>
    No. of Years <input type="number"  id="years" list ="all years">
    <datalist id ="all years">
        <option value="1"></option>
        <option value="2"></option>
    </datalist><br/>
    Interest : <span id="result"></span><br>
    <button onclick="compute()">Compute Interest</button>
</div>


<footer>
    &#169; This Calculator belongs to --your name--
</footer>


</body>
</html>
